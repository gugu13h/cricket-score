<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Scoreboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root{
    --bg: #081b12;
    --panel: #0f2b1c;
    --panel-2: #12331f;
    --line: #1e4a2c;
    --amber: #f0b429;
    --amber-dim: #7a5c14;
    --red: #d94a3d;
    --text: #eef3ea;
    --text-dim: #93a894;
    --green-glow: #3ecf6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(62,207,106,0.08), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 40px);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    min-height:100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 920px; margin: 0 auto;}

  .masthead{
    text-align:center;
    margin-bottom: 28px;
  }
  .masthead .eyebrow{
    font-family:'Share Tech Mono', monospace;
    letter-spacing: 3px;
    color: var(--amber);
    font-size: 12px;
    text-transform: uppercase;
  }
  .masthead h1{
    font-size: 34px;
    font-weight: 700;
    margin: 6px 0 0;
    letter-spacing: 1px;
  }

  /* ---- Login screen ---- */
  .login-card{
    max-width: 380px;
    margin: 60px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 28px;
    text-align:center;
  }
  .login-card p{color:var(--text-dim); font-size:14px; margin-top:0;}
  .login-card input{
    width:100%;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .login-card input:focus{outline:none; border-color: var(--amber);}
  .btn{
    background: var(--amber);
    color: #241a03;
    border: none;
    padding: 12px 18px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 15px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .btn:hover{filter: brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-ghost:hover{border-color: var(--text-dim);}
  .btn-small{padding: 6px 10px; font-size: 13px;}
  .btn-danger{background: var(--red); color:#fff;}

  /* ---- Top bar after login ---- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 20px; font-family:'Share Tech Mono', monospace; font-size: 13px;
    color: var(--text-dim);
  }
  .topbar span.name{color:var(--amber);}

  /* ---- Match summary strip ---- */
  .summary{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.24);
  }
  .summary .side{text-align:center;}
  .summary .side h2{
    margin:0 0 6px; font-size:16px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
  }
  .summary .side .score{
    font-family:'Share Tech Mono', monospace;
    font-size: 30px;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(240,180,41,0.35);
  }
  .summary .side .overs{font-size:12px; color:var(--text-dim); font-family:'Share Tech Mono', monospace;}
  .summary .side .balls-total{
    font-size:12px;
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    margin-top: 3px;
  }
  .summary .vs{
    font-size: 13px; color: var(--text-dim); letter-spacing: 2px; padding: 0 14px;
  }

  .crease{
    grid-column: 1 / -1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .batter-card{
    background: rgba(0,0,0,0.16);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 8px 10px;
    min-width: 0;
  }
  .batter-card .label{
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 11px;
    margin-bottom: 3px;
  }
  .batter-card .value{
    display:flex;
    justify-content:space-between;
    gap: 8px;
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
  }
  .batter-card .value span:first-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .ball-log{
    grid-column: 1 / -1;
    display:flex;
    flex-wrap:wrap;
    gap: 6px;
    justify-content:center;
    margin-top: 10px;
  }
  .ball-chip{
    min-width: 28px;
    height: 28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    font-size: 12px;
  }
  .ball-chip.boundary{color: var(--green-glow); border-color: rgba(62,207,106,0.35);}
  .ball-chip.wicket{color: #fff; background: var(--red); border-color: var(--red);}
  .ball-chip.extra{color: var(--amber); border-color: rgba(240,180,41,0.45);}
  @media (max-width: 560px){ .crease{grid-template-columns: 1fr;} }

  /* ---- Team panels ---- */
  .teams{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .teams.single{grid-template-columns: minmax(0, 1fr);}
  @media (max-width: 720px){ .teams{grid-template-columns: 1fr;} }

  .team{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
  }
  .team-head{
    background: var(--panel-2);
    padding: 12px 14px;
    display:flex; gap:8px; align-items:center;
    border-bottom: 1px solid var(--line);
  }
  .team-head input{
    flex:1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line);
    color: var(--amber);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 18px;
    padding: 4px 2px;
  }
  .team-head input:focus{outline:none; border-bottom-color: var(--amber);}

  .add-player{
    display:flex; gap:8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .add-player input{
    flex:1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    padding: 8px 10px;
    font-family:'Oswald', sans-serif;
    font-size: 14px;
  }
  .add-player input:focus{outline:none; border-color: var(--amber);}

  .players{padding: 8px 10px 14px;}
  .player{
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 10px 4px;
  }
  .player:last-child{border-bottom:none;}
  .player-row1{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 8px;
  }
  .player-name{font-size:15px; font-weight:500;}
  .player-name.out{color: var(--text-dim); text-decoration: line-through;}
  .player-stats{
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--amber);
    white-space: nowrap;
  }
  .player-stats .balls{color: var(--text-dim); font-size:12px;}
  .runbtns{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .runbtn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    width: 32px; height: 30px;
    border-radius: 3px;
    cursor:pointer;
    font-size: 13px;
  }
  .runbtn:hover{border-color: var(--amber); color: var(--amber);}
  .runbtn.six{color: var(--green-glow); border-color: rgba(62,207,106,0.3);}
  .runbtn.six:hover{border-color: var(--green-glow);}
  .runbtn.extra{width:auto; padding: 0 10px; color: var(--amber); border-color: rgba(240,180,41,0.35);}
  .iconbtn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: 3px;
    cursor:pointer;
    font-size: 13px;
    margin-left: auto;
  }
  .iconbtn:hover{border-color: var(--red); color: var(--red);}
  .iconbtn.out-toggle:hover{border-color: var(--amber); color: var(--amber);}

  .empty{color: var(--text-dim); font-size: 13px; padding: 14px; text-align:center;}

  .innings-actions{
    padding: 14px;
    border-top: 1px solid var(--line);
    background: rgba(0,0,0,0.12);
  }

  .chase-info{
    grid-column: 1 / -1;
    text-align:center;
    color: var(--amber);
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
    margin-top: 12px;
  }

  .chase-info.done{color: var(--green-glow);}
  .chase-info.short{color: var(--red);}

  .footer-note{
    text-align:center; color: var(--text-dim); font-size:12px; margin-top: 26px;
    font-family:'Share Tech Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">

// Firebase config: paste your web app config values here.
// Firebase Console > Project settings > General > Your apps > Web app config.
const firebaseConfig = {
  apiKey: 'AIzaSyDQReO2ZfJ8MVqIdM2nHC2R622OZ3YHVjE',
  authDomain: 'cricket-score-a1422.firebaseapp.com',
  projectId: 'cricket-score-a1422',
  storageBucket: 'cricket-score-a1422.firebasestorage.app',
  messagingSenderId: '1029693418477',
  appId: '1:1029693418477:web:800ea3e8ccfaf4d73f15e4'
};

const FIRESTORE_COLLECTION = 'matches';
const FIRESTORE_DOCUMENT_ID = 'main-scoreboard';
let currentUser = null;
let state = null;
let db = null;
let firebaseApi = null;
let unsubscribeScore = null;
let storageWorks = false; // only true once we've confirmed Firestore reads/writes actually succeed

function defaultState(){
  return {
    teamA: { name: 'Team A', players: [], extras: 0, ballLog: [] },
    teamB: { name: 'Team B', players: [], extras: 0, ballLog: [] },
    firstInningsComplete: false,
    firstInningsBalls: null,
    targetRuns: null
  };
}

function normalizeState(raw){
  const base = defaultState();
  const next = raw && typeof raw === 'object' ? raw : {};
  return {
    ...base,
    ...next,
    teamA: { ...base.teamA, ...(next.teamA || {}), ballLog: (next.teamA && next.teamA.ballLog) || [] },
    teamB: { ...base.teamB, ...(next.teamB || {}), ballLog: (next.teamB && next.teamB.ballLog) || [] }
  };
}

function uid(){
  return Math.random().toString(36).slice(2,9);
}

function isFirebaseConfigured(){
  return Boolean(
    firebaseConfig.apiKey &&
    firebaseConfig.authDomain &&
    firebaseConfig.projectId &&
    firebaseConfig.appId
  );
}

async function loadFirebaseApi(){
  if(firebaseApi) return firebaseApi;
  if(!isFirebaseConfigured()){
    console.warn('Firebase config is empty. Add your Firebase web app keys in index.html.');
    return null;
  }

  try{
    const [appModule, firestoreModule] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js')
    ]);
    firebaseApi = {
      initializeApp: appModule.initializeApp,
      getFirestore: firestoreModule.getFirestore,
      doc: firestoreModule.doc,
      getDoc: firestoreModule.getDoc,
      onSnapshot: firestoreModule.onSnapshot,
      setDoc: firestoreModule.setDoc,
      serverTimestamp: firestoreModule.serverTimestamp
    };
    return firebaseApi;
  }catch(e){
    console.error('Firebase SDK load failed', e);
    return null;
  }
}

async function getDb(){
  if(db) return db;
  const api = await loadFirebaseApi();
  if(!api) return null;
  const app = api.initializeApp(firebaseConfig);
  db = api.getFirestore(app);
  return db;
}

// Loads state from Firestore. Returns null (instead of a default) on
// any failure, so callers never accidentally wipe local unsaved data.
async function loadState(){
  const firestore = await getDb();
  if(!firestore) return null;
  const api = await loadFirebaseApi();
  try{
    const snap = await api.getDoc(api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID));
    if(snap.exists()){
      const data = snap.data();
      storageWorks = true;
      return normalizeState(data.state);
    }
    storageWorks = true;
    return defaultState();
  }catch(e){
    return null;
  }
}

async function saveState(){
  const firestore = await getDb();
  if(!firestore) return;
  const api = await loadFirebaseApi();
  try{
    await api.setDoc(
      api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID),
      {
        state,
        updatedAt: api.serverTimestamp(),
        updatedBy: currentUser || 'unknown'
      },
      { merge: true }
    );
    storageWorks = true;
  }catch(e){
    console.error('Save failed', e);
  }
}

async function watchState(){
  const firestore = await getDb();
  if(!firestore || unsubscribeScore) return;
  const api = await loadFirebaseApi();

  unsubscribeScore = api.onSnapshot(
    api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID),
    snap=>{
      if(!currentUser || !snap.exists()) return;
      const data = snap.data();
      state = normalizeState(data.state);
      render();
    },
    e=>console.error('Live Firestore update failed', e)
  );
}

function oversDisplay(balls){
  const overs = Math.floor(balls/6);
  const rem = balls % 6;
  return overs + '.' + rem;
}

function teamTotals(team){
  let battingRuns = 0, balls = 0, outs = 0;
  team.players.forEach(p=>{
    battingRuns += p.runs;
    balls += p.balls;
    if(p.out) outs++;
  });
  return {runs: battingRuns + (team.extras || 0), battingRuns, extras: team.extras || 0, balls, outs};
}

function currentBatters(team){
  return team.players.filter(p=>!p.out).slice(0, 2);
}

function addBallEvent(teamKey, label, type){
  const team = state[teamKey];
  team.ballLog = team.ballLog || [];
  team.ballLog.push({ id: uid(), label, type });
  if(team.ballLog.length > 36){
    team.ballLog = team.ballLog.slice(-36);
  }
}

async function addExtra(teamKey, label){
  state[teamKey].extras = (state[teamKey].extras || 0) + 1;
  addBallEvent(teamKey, label, 'extra');
  await saveState();
  render();
}

function chaseStatus(totB){
  if(!state.firstInningsComplete) return null;
  const target = state.targetRuns || 0;
  const totalBalls = state.firstInningsBalls || 0;
  const runsNeeded = Math.max(target - totB.runs, 0);
  const ballsLeft = Math.max(totalBalls - totB.balls, 0);
  const won = runsNeeded === 0;
  const short = !won && ballsLeft === 0;
  return { target, totalBalls, runsNeeded, ballsLeft, won, short };
}

async function completeFirstInnings(){
  const totA = teamTotals(state.teamA);
  state.firstInningsComplete = true;
  state.firstInningsBalls = totA.balls;
  state.targetRuns = totA.runs + 1;
  await saveState();
  render();
}

function render(){
  const app = document.getElementById('app');

  if(!currentUser){
    app.innerHTML = `
      <div class="masthead">
        <div class="eyebrow">Live scoring</div>
        <h1>Cricket Scoreboard</h1>
      </div>
      <div class="login-card">
        <p>Apna naam daalein aur scoring shuru karein</p>
        <input id="loginName" type="text" placeholder="Aapka naam" maxlength="30" />
        <button class="btn btn-block" id="loginBtn">Login</button>
      </div>
    `;
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('loginName').addEventListener('keydown', e=>{
      if(e.key === 'Enter') doLogin();
    });
    return;
  }

  const totA = teamTotals(state.teamA);
  const totB = teamTotals(state.teamB);
  const chase = chaseStatus(totB);
  const chaseHtml = chase
    ? `<div class="chase-info${chase.won ? ' done' : chase.short ? ' short' : ''}">
        ${chase.won
          ? `${escapeHtml(state.teamB.name)} won the chase`
          : chase.short
            ? `${escapeHtml(state.teamB.name)} short by ${chase.runsNeeded} runs`
            : `${escapeHtml(state.teamB.name)} needs ${chase.runsNeeded} runs in ${chase.ballsLeft} balls`}
      </div>`
    : '';
  const activeTeamKey = state.firstInningsComplete ? 'teamB' : 'teamA';
  const activeTeam = state[activeTeamKey];
  const batters = currentBatters(activeTeam);
  while(batters.length < 2){
    batters.push(null);
  }
  const battersHtml = batters.slice(0, 2).map((p, idx)=>`
    <div class="batter-card">
      <div class="label">Batsman ${idx + 1}</div>
      <div class="value">
        <span>${p ? escapeHtml(p.name) : 'Add player'}</span>
        <strong>${p ? `${p.runs}(${p.balls})` : '0(0)'}</strong>
      </div>
    </div>
  `).join('');
  const ballLogHtml = (activeTeam.ballLog || []).length
    ? activeTeam.ballLog.slice(-12).map(ball=>`
      <span class="ball-chip ${ball.type || ''}">${escapeHtml(ball.label)}</span>
    `).join('')
    : `<span class="ball-chip">-</span>`;

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Live scoring</div>
      <h1>Cricket Scoreboard</h1>
    </div>

    <div class="topbar">
      <span>Scoring by <span class="name">${escapeHtml(currentUser)}</span></span>
      <button class="btn btn-ghost btn-small" id="logoutBtn">Logout</button>
    </div>

    <div class="summary">
      <div class="side">
        <h2>${escapeHtml(state.teamA.name)}</h2>
        <div class="score">${totA.runs}/${totA.outs}</div>
        <div class="overs">Extras ${totA.extras}</div>
        <div class="overs">${oversDisplay(totA.balls)} overs</div>
        <div class="balls-total">${totA.balls} balls</div>
      </div>
      <div class="vs">VS</div>
      <div class="side">
        <h2>${escapeHtml(state.teamB.name)}</h2>
        <div class="score">${totB.runs}/${totB.outs}</div>
        <div class="overs">Extras ${totB.extras}</div>
        <div class="overs">${oversDisplay(totB.balls)} overs</div>
        <div class="balls-total">${totB.balls} balls</div>
      </div>
      <div class="crease">${battersHtml}</div>
      <div class="ball-log">${ballLogHtml}</div>
      ${chaseHtml}
    </div>

    <div class="teams single">
      ${teamPanel(activeTeamKey)}
    </div>

    <div class="footer-note">Data yahan sabko dikhta hai &mdash; jo bhi score update karega, sab dekh payenge</div>
  `;

  document.getElementById('logoutBtn').onclick = ()=>{
    currentUser = null;
    if(unsubscribeScore){
      unsubscribeScore();
      unsubscribeScore = null;
    }
    render();
  };

  [activeTeamKey].forEach(key=>{
    const nameInput = document.getElementById('name-'+key);
    nameInput.addEventListener('change', async ()=>{
      state[key].name = nameInput.value.trim() || (key==='teamA' ? 'Team A':'Team B');
      await saveState();
      render();
    });

    const addBtn = document.getElementById('addbtn-'+key);
    const addInput = document.getElementById('addinput-'+key);
    const addPlayerNow = async ()=>{
      const name = addInput.value.trim();
      if(!name) return;
      state[key].players.push({ id: uid(), name, runs:0, balls:0, out:false });
      await saveState();
      render();
    };
    addBtn.addEventListener('click', addPlayerNow);
    addInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        addPlayerNow();
      }
    });

    state[key].players.forEach(p=>{
      const addRunBtn = (n)=>{
        const btn = document.getElementById(`run-${p.id}-${n}`);
        if(btn){
          btn.onclick = async ()=>{
            p.runs += n;
            p.balls += 1;
            addBallEvent(key, String(n), n === 4 || n === 6 ? 'boundary' : '');
            await saveState();
            render();
          };
        }
      };
      [0,1,2,3,4,6].forEach(addRunBtn);

      const outBtn = document.getElementById('out-'+p.id);
      if(outBtn){
        outBtn.onclick = async ()=>{
          if(!p.out){
            p.out = true;
            p.balls += 1;
            addBallEvent(key, 'W', 'wicket');
          }else{
            p.out = false;
          }
          await saveState();
          render();
        };
      }
      const delBtn = document.getElementById('del-'+p.id);
      if(delBtn){
        delBtn.onclick = async ()=>{
          state[key].players = state[key].players.filter(x=>x.id!==p.id);
          await saveState();
          render();
        };
      }
    });

    const wideBtn = document.getElementById('wide-'+key);
    if(wideBtn){
      wideBtn.onclick = ()=>addExtra(key, 'Wd');
    }
    const noBallBtn = document.getElementById('noball-'+key);
    if(noBallBtn){
      noBallBtn.onclick = ()=>addExtra(key, 'Nb');
    }
  });

  const completeBtn = document.getElementById('completeFirstInningsBtn');
  if(completeBtn){
    completeBtn.onclick = completeFirstInnings;
  }
}

function teamPanel(key){
  const team = state[key];
  const inningsActionHtml = key === 'teamA' && !state.firstInningsComplete
    ? `<div class="innings-actions">
        <button type="button" class="btn btn-block" id="completeFirstInningsBtn">1st Inning Completed</button>
      </div>`
    : '';
  const playersHtml = team.players.length
    ? team.players.map(p=>`
      <div class="player">
        <div class="player-row1">
          <span class="player-name${p.out? ' out':''}">${escapeHtml(p.name)}${p.out? ' (out)':''}</span>
          <span class="player-stats">${p.runs}<span class="balls">&nbsp;(${p.balls}b)</span></span>
        </div>
        <div class="runbtns">
          <button class="runbtn" id="run-${p.id}-0">0</button>
          <button class="runbtn" id="run-${p.id}-1">1</button>
          <button class="runbtn" id="run-${p.id}-2">2</button>
          <button class="runbtn" id="run-${p.id}-3">3</button>
          <button class="runbtn" id="run-${p.id}-4">4</button>
          <button class="runbtn six" id="run-${p.id}-6">6</button>
          <button class="iconbtn out-toggle" id="out-${p.id}" title="Out / Not out">${p.out ? '↺' : '✕'}</button>
          <button class="iconbtn" id="del-${p.id}" title="Player hataayein">🗑</button>
        </div>
      </div>
    `).join('')
    : `<div class="empty">Abhi koi player nahi joda gaya</div>`;

  return `
    <div class="team">
      <div class="team-head">
        <input id="name-${key}" type="text" value="${escapeHtml(team.name)}" maxlength="24" />
      </div>
      <div class="add-player" id="addform-${key}">
        <input id="addinput-${key}" type="text" placeholder="Player ka naam" maxlength="24" />
        <button type="button" class="btn btn-small" id="addbtn-${key}">Add</button>
      </div>
      <div class="add-player">
        <button type="button" class="runbtn extra" id="wide-${key}">Wide +1</button>
        <button type="button" class="runbtn extra" id="noball-${key}">No Ball +1</button>
      </div>
      <div class="players">${playersHtml}</div>
      ${inningsActionHtml}
    </div>
  `;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function doLogin(){
  const val = document.getElementById('loginName').value.trim();
  if(!val) return;
  currentUser = val;
  state = defaultState();
  render();

  const loaded = await loadState();
  if(loaded){
    state = loaded;
    render();
  }
  watchState();
}

// initial render (login screen)
render();
</script>
</body>
</html>
