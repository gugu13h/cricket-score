<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Scoreboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

  :root{
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --line: #cbd5e1;
    --amber: #f59e0b;
    --amber-dim: #b45309;
    --red: #dc2626;
    --text: #0f172a;
    --text-dim: #475569;
    --green-glow: #22c55e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: #ffffff;
    color: #111111;
    font-family: 'Oswald', sans-serif;
    min-height:100vh;
    padding: 24px 16px 60px;
  }
  .wrap{max-width: 920px; margin: 0 auto;}

  .masthead{
    text-align:center;
    margin-bottom: 28px;
  }
  .masthead .eyebrow{
    font-family:'Share Tech Mono', monospace;
    letter-spacing: 3px;
    color: var(--amber);
    font-size: 12px;
    text-transform: uppercase;
  }
  .masthead h1{
    font-size: 34px;
    font-weight: 700;
    margin: 6px 0 0;
    letter-spacing: 1px;
  }

  /* ---- Login screen ---- */
  .login-card{
    max-width: 380px;
    margin: 60px auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 28px;
    text-align:center;
  }
  .login-card p{color:var(--text-dim); font-size:14px; margin-top:0;}
  .login-card input{
    width:100%;
    padding: 12px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .login-card input:focus{outline:none; border-color: var(--amber);}
  .field{
    display:grid;
    gap: 6px;
    margin-bottom: 12px;
  }
  .field label{
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
  }
  .field input,
  .field select{
    width:100%;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family:'Oswald',sans-serif;
    font-size: 15px;
  }
  .field input:focus,
  .field select:focus{outline:none; border-color: var(--amber);}
  .team > .field{padding: 12px 14px 0;}
  .public-login{
    max-width: 380px;
    margin: 26px auto 0;
  }
  .score-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 18px;
  }
  @media (max-width: 720px){ .score-grid{grid-template-columns: 1fr;} }
  .score-table{
    width:100%;
    border-collapse: collapse;
    font-family:'Share Tech Mono', monospace;
    font-size: 13px;
  }
  .score-table th,
  .score-table td{
    padding: 8px 6px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    text-align:left;
  }
  .score-table th{
    color: var(--text-dim);
    font-weight: 400;
  }
  .score-table button{
    background:none;
    border:none;
    color:var(--amber);
    font:inherit;
    padding:0;
    cursor:pointer;
  }
  .score-table td:last-child,
  .score-table th:last-child{text-align:right;}
  .match-details{
    margin: 18px 0 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
  }
  .match-details h2{
    margin: 0 0 12px;
    font-size: 18px;
  }
  .detail-grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }
  @media (max-width: 720px){ .detail-grid{grid-template-columns: 1fr 1fr;} }
  .detail-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px;
    min-width: 0;
  }
  .detail-item .label{
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
  }
  .detail-item .value{
    margin-top: 4px;
    font-size: 18px;
    overflow-wrap: anywhere;
  }
  .search-panel{
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
  }
  .search-panel input{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 10px 12px;
    font-family:'Oswald', sans-serif;
    font-size: 15px;
  }
  .detail-box{
    margin-top: 10px;
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
  }
  .btn{
    background: var(--amber);
    color: #ffffff;
    border: none;
    padding: 12px 18px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 15px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .btn:hover{filter: brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-ghost:hover{border-color: var(--text-dim);}
  .btn-small{padding: 6px 10px; font-size: 13px;}
  .btn-danger{background: var(--red); color:#fff;}

  /* ---- Top bar after login ---- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 20px; font-family:'Share Tech Mono', monospace; font-size: 13px;
    color: var(--text-dim);
  }
  .topbar span.name{color:var(--amber);}

  /* ---- Match summary strip ---- */
  .summary{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.24);
  }
  .summary .side{text-align:center;}
  .summary .side h2{
    margin:0 0 6px; font-size:16px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
  }
  .summary .side .score{
    font-family:'Share Tech Mono', monospace;
    font-size: 30px;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(240,180,41,0.35);
  }
  .summary .side .overs{font-size:12px; color:var(--text-dim); font-family:'Share Tech Mono', monospace;}
  .summary .side .balls-total{
    font-size:12px;
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    margin-top: 3px;
  }
  .summary .vs{
    font-size: 13px; color: var(--text-dim); letter-spacing: 2px; padding: 0 14px;
  }

  .crease{
    grid-column: 1 / -1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }
  .batter-card{
    background: rgba(0,0,0,0.16);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 8px 10px;
    min-width: 0;
  }
  .batter-card .label{
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 11px;
    margin-bottom: 3px;
  }
  .batter-card .value{
    display:flex;
    justify-content:space-between;
    gap: 8px;
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
  }
  .batter-card .value span:first-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .current-bowler{
    grid-column: 1 / -1;
    text-align:center;
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 13px;
    margin-top: 10px;
  }
  .current-bowler strong{color: var(--amber);}

  .ball-log{
    grid-column: 1 / -1;
    display:flex;
    flex-wrap:wrap;
    gap: 6px;
    justify-content:center;
    margin-top: 10px;
  }
  .ball-chip{
    min-width: 28px;
    height: 28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    font-size: 12px;
  }
  .ball-chip.boundary{color: var(--green-glow); border-color: rgba(126,220,156,0.35);}
  .ball-chip.wicket{color: #fff; background: var(--red); border-color: var(--red);}
  .ball-chip.extra{color: var(--amber); border-color: rgba(240,180,41,0.45);}
  @media (max-width: 560px){ .crease{grid-template-columns: 1fr;} }

  /* ---- Team panels ---- */
  .teams{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .teams.single{grid-template-columns: minmax(0, 1fr);}
  @media (max-width: 720px){ .teams{grid-template-columns: 1fr;} }

  .team{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
  }
  .team-head{
    background: var(--panel-2);
    padding: 12px 14px;
    display:flex; gap:8px; align-items:center;
    border-bottom: 1px solid var(--line);
  }
  .team-head input{
    flex:1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line);
    color: var(--amber);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 18px;
    padding: 4px 2px;
  }
  .team-head input:focus{outline:none; border-bottom-color: var(--amber);}

  .add-player{
    display:flex; gap:8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .add-player input,
  .add-player select{
    flex:1;
    min-width:0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    padding: 8px 10px;
    font-family:'Oswald', sans-serif;
    font-size: 14px;
  }
  .add-player input:focus,
  .add-player select:focus{outline:none; border-color: var(--amber);}

  .players{padding: 8px 10px 14px;}
  .player{
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 10px 4px;
  }
  .player:last-child{border-bottom:none;}
  .player-edit{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .player-edit input{
    flex:1;
    min-width:0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 8px 10px;
    font-family:'Oswald', sans-serif;
    font-size: 15px;
  }
  .player-edit input:focus{outline:none; border-color: var(--amber);}
  .player-row1{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 8px;
  }
  .player-name{font-size:15px; font-weight:500;}
  .player-name.out{color: var(--text-dim); text-decoration: line-through;}
  .player-stats{
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
    color: var(--amber);
    white-space: nowrap;
  }
  .player-stats .balls{color: var(--text-dim); font-size:12px;}
  .runbtns{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .runbtn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Share Tech Mono', monospace;
    width: 32px; height: 30px;
    border-radius: 3px;
    cursor:pointer;
    font-size: 13px;
  }
  .runbtn:hover{border-color: var(--amber); color: var(--amber);}
  .runbtn.six{color: var(--green-glow); border-color: rgba(126,220,156,0.3);}
  .runbtn.six:hover{border-color: var(--green-glow);}
  .runbtn.extra{width:auto; padding: 0 10px; color: var(--amber); border-color: rgba(240,180,41,0.35);}
  .runbtn.active{background: var(--amber); color:#241a03; border-color: var(--amber);}
  .iconbtn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 30px; height: 30px;
    border-radius: 3px;
    cursor:pointer;
    font-size: 13px;
    margin-left: auto;
  }
  .iconbtn:hover{border-color: var(--red); color: var(--red);}
  .iconbtn.out-toggle:hover{border-color: var(--amber); color: var(--amber);}

  .empty{color: var(--text-dim); font-size: 13px; padding: 14px; text-align:center;}

  .innings-actions{
    padding: 14px;
    border-top: 1px solid var(--line);
    background: rgba(0,0,0,0.12);
  }

  .match-history{
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
  }
  .match-history h2{
    margin:0;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    color: var(--amber);
    font-size: 18px;
  }
  .history-list{padding: 8px 10px 14px;}
  .history-match{
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 8px 14px;
    align-items:center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 10px 4px;
  }
  .history-match:last-child{border-bottom:none;}
  .history-title{font-size:15px; font-weight:500;}
  .history-score{
    color: var(--amber);
    font-family:'Share Tech Mono', monospace;
    white-space: nowrap;
  }
  .history-meta{
    grid-column: 1 / -1;
    color: var(--text-dim);
    font-family:'Share Tech Mono', monospace;
    font-size: 12px;
  }

  .chase-info{
    grid-column: 1 / -1;
    text-align:center;
    color: var(--amber);
    font-family:'Share Tech Mono', monospace;
    font-size: 14px;
    margin-top: 12px;
  }

  .chase-info.done{color: var(--green-glow);}
  .chase-info.short{color: var(--red);}

  .footer-note{
    text-align:center; color: var(--text-dim); font-size:12px; margin-top: 26px;
    font-family:'Share Tech Mono', monospace;
  }
</style>
</head>

<div class="wrap" id="app"></div>

<script type="module">

// Firebase web app config
// This page loads Firebase SDK modules directly from the CDN below.
// Remove static bare-module imports so this file works in the browser
// without a bundler.
// Firebase config: paste your Firebase Web app config values here.
// Find it in Firebase Console > Project settings > General > Your apps > Web app.

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDQReO2ZfJ8MVqIdM2nHC2R622OZ3YHVjE",
  authDomain: "cricket-score-a1422.firebaseapp.com",
  projectId: "cricket-score-a1422",
  storageBucket: "cricket-score-a1422.firebasestorage.app",
  messagingSenderId: "1029693418477",
  appId: "1:1029693418477:web:259937802f04ca2d3f15e4",
  measurementId: "G-Q72MQGRXJ8"
};


const FIRESTORE_COLLECTION = 'matches';
const FIRESTORE_DOCUMENT_ID = 'main-scoreboard';
const COMPLETED_MATCH_RETENTION_MS = 14 * 24 * 60 * 60 * 1000;
const FIREBASE_SDK_VERSION = '12.1.0';
let currentUser = null;
let state = null;
let db = null;
let firebaseApi = null;
let unsubscribeScore = null;
let storageWorks = false; // only true once we've confirmed Firestore reads/writes actually succeed

function defaultState(){
  return {
    teamA: { name: 'Team A', players: [], bowlers: [], activeBatterIds: [], activeBowlerId: null, extras: 0, ballLog: [] },
    teamB: { name: 'Team B', players: [], bowlers: [], activeBatterIds: [], activeBowlerId: null, extras: 0, ballLog: [] },
    matchOvers: 4,
    firstInningsComplete: false,
    firstInningsBalls: null,
    targetRuns: null,
    completedMatches: []
  };
}

function defaultPlayer(name){
  return { id: uid(), name, runs: 0, balls: 0, out: false, runCounts: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0, 6: 0 } };
}

function normalizePlayer(player){
  return {
    ...defaultPlayer(player && player.name ? player.name : ''),
    ...(player || {}),
    runCounts: {
      0: 0,
      1: 0,
      2: 0,
      3: 0,
      4: 0,
      6: 0,
      ...((player && player.runCounts) || {})
    }
  };
}

function normalizeBowler(bowler){
  return { id: uid(), name: '', runs: 0, balls: 0, wickets: 0, ...(bowler || {}) };
}

function normalizeState(raw){
  const base = defaultState();
  const next = raw && typeof raw === 'object' ? raw : {};
  const normalized = {
    ...base,
    ...next,
    teamA: {
      ...base.teamA,
      ...(next.teamA || {}),
      ballLog: (next.teamA && next.teamA.ballLog) || [],
      players: ((next.teamA && next.teamA.players) || []).map(normalizePlayer),
      bowlers: ((next.teamA && next.teamA.bowlers) || []).map(normalizeBowler)
    },
    teamB: {
      ...base.teamB,
      ...(next.teamB || {}),
      ballLog: (next.teamB && next.teamB.ballLog) || [],
      players: ((next.teamB && next.teamB.players) || []).map(normalizePlayer),
      bowlers: ((next.teamB && next.teamB.bowlers) || []).map(normalizeBowler)
    },
    matchOvers: clampMatchOvers(next.matchOvers || base.matchOvers),
    completedMatches: pruneCompletedMatches(next.completedMatches || [])
  };
  normalizeTeamSelection(normalized.teamA);
  normalizeTeamSelection(normalized.teamB);
  syncBowlerNames(normalized.teamA);
  syncBowlerNames(normalized.teamB);
  return normalized;
}

function clampMatchOvers(value){
  const overs = Number(value);
  if(!Number.isFinite(overs)) return 4;
  return Math.min(20, Math.max(4, Math.floor(overs)));
}

function normalizeTeamSelection(team){
  const playerIds = new Set(team.players.map(p=>p.id));
  const selected = Array.isArray(team.activeBatterIds)
    ? team.activeBatterIds.filter(id=>playerIds.has(id) && team.players.some(p=>p.id === id && !p.out))
    : [];
  const uniqueSelected = [];
  selected.forEach(id=>{
    if(!uniqueSelected.includes(id)) uniqueSelected.push(id);
  });
  selected.length = 0;
  selected.push(...uniqueSelected);
  team.players.filter(p=>!p.out && !selected.includes(p.id)).slice(0, 2).forEach(p=>{
    if(selected.length < 2) selected.push(p.id);
  });
  team.activeBatterIds = selected.slice(0, 2);
  if(team.activeBowlerId && !playerIds.has(team.activeBowlerId)){
    team.activeBowlerId = null;
  }
}

function syncBowlerNames(team){
  team.bowlers = (team.bowlers || []).filter(b=>team.players.some(p=>p.id === b.id));
  team.bowlers.forEach(b=>{
    const player = team.players.find(p=>p.id === b.id);
    if(player) b.name = player.name;
  });
}

function pruneCompletedMatches(matches){
  const cutoff = Date.now() - COMPLETED_MATCH_RETENTION_MS;
  return (Array.isArray(matches) ? matches : [])
    .filter(match=>Number(match.completedAt || 0) >= cutoff)
    .sort((a,b)=>Number(b.completedAt || 0) - Number(a.completedAt || 0));
}

function uid(){
  return Math.random().toString(36).slice(2,9);
}

function isFirebaseConfigured(){
  return Boolean(
    firebaseConfig.apiKey &&
    firebaseConfig.authDomain &&
    firebaseConfig.projectId &&
    firebaseConfig.appId
  );
}

async function loadFirebaseApi(){
  if(firebaseApi) return firebaseApi;
  if(!isFirebaseConfigured()){
    console.warn('Firebase config is empty. Add your Firebase web app keys in index.html.');
    return null;
  }

  try{
    const [appModule, firestoreModule] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/firebase-firestore.js`)
    ]);
    firebaseApi = {
      initializeApp: appModule.initializeApp,
      getFirestore: firestoreModule.getFirestore,
      doc: firestoreModule.doc,
      getDoc: firestoreModule.getDoc,
      onSnapshot: firestoreModule.onSnapshot,
      setDoc: firestoreModule.setDoc,
      serverTimestamp: firestoreModule.serverTimestamp
    };
    return firebaseApi;
  }catch(e){
    console.error('Firebase SDK load failed', e);
    return null;
  }
}

async function getDb(){
  if(db) return db;
  const api = await loadFirebaseApi();
  if(!api) return null;
  try{
    const app = api.initializeApp(firebaseConfig);
    db = api.getFirestore(app);
    console.log('Firebase init succeeded for project:', firebaseConfig.projectId);
    return db;
  }catch(e){
    console.error('Firebase init failed', e);
    return null;
  }
}

// Loads state from Firestore. Returns null (instead of a default) on
// any failure, so callers never accidentally wipe local unsaved data.
async function loadState(){
  const firestore = await getDb();
  if(!firestore) {
    console.warn('Firestore is unavailable during loadState.');
    return null;
  }
  const api = await loadFirebaseApi();
  try{
    const snap = await api.getDoc(api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID));
    if(snap.exists()){
      const data = snap.data();
      storageWorks = true;
      console.log('Firestore state loaded successfully.');
      return normalizeState(data.state);
    }
    storageWorks = true;
    console.log('Firestore document not found; using default state.');
    return defaultState();
  }catch(e){
    console.error('Firestore load failed', e);
    return null;
  }
}

async function saveState(){
  const firestore = await getDb();
  if(!firestore) return;
  const api = await loadFirebaseApi();
  try{
    state = normalizeState(state);
    await api.setDoc(
      api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID),
      {
        state,
        updatedAt: api.serverTimestamp(),
        updatedBy: currentUser || 'unknown'
      },
      { merge: true }
    );
    storageWorks = true;
  }catch(e){
    console.error('Save failed', e);
  }
}

async function watchState(){
  const firestore = await getDb();
  if(!firestore || unsubscribeScore) return;
  const api = await loadFirebaseApi();

  unsubscribeScore = api.onSnapshot(
    api.doc(firestore, FIRESTORE_COLLECTION, FIRESTORE_DOCUMENT_ID),
    snap=>{
      if(!snap.exists()) return;
      const data = snap.data();
      state = normalizeState(data.state);
      render();
    },
    e=>console.error('Live Firestore update failed', e)
  );
}

function oversDisplay(balls){
  const overs = Math.floor(balls/6);
  const rem = balls % 6;
  return overs + '.' + rem;
}

function teamTotals(team){
  let battingRuns = 0, balls = 0, outs = 0;
  team.players.forEach(p=>{
    battingRuns += p.runs;
    balls += p.balls;
    if(p.out) outs++;
  });
  return {runs: battingRuns + (team.extras || 0), battingRuns, extras: team.extras || 0, balls, outs};
}

function currentBatters(team){
  const selected = (team.activeBatterIds || [])
    .map(id=>team.players.find(p=>p.id === id && !p.out))
    .filter(Boolean);
  return selected.length ? selected : team.players.filter(p=>!p.out).slice(0, 2);
}

function opponentKey(teamKey){
  return teamKey === 'teamA' ? 'teamB' : 'teamA';
}

function activeBowler(teamKey){
  const team = state[teamKey];
  if(!team.activeBowlerId) return null;
  const player = team.players.find(p=>p.id === team.activeBowlerId);
  if(!player) return null;
  const bowler = (team.bowlers || []).find(b=>b.id === team.activeBowlerId);
  return bowler ? { ...bowler, name: player.name } : { id: player.id, name: player.name, runs: 0, balls: 0, wickets: 0 };
}

function economy(bowler){
  const balls = bowler.balls || 0;
  if(!balls) return '0.00';
  return (((bowler.runs || 0) / balls) * 6).toFixed(2);
}

function strikeRate(player){
  return player.balls ? ((player.runs / player.balls) * 100).toFixed(2) : '0.00';
}

function playerDetailText(player){
  const counts = player.runCounts || {};
  return `${escapeHtml(player.name)}: ${player.runs}(${player.balls}), SR ${strikeRate(player)}, 1s ${counts[1] || 0}, 2s ${counts[2] || 0}, 3s ${counts[3] || 0}, 4s ${counts[4] || 0}, 6s ${counts[6] || 0}`;
}

function bowlerDetailText(bowler){
  return `${escapeHtml(bowler.name)}: Runs ${bowler.runs || 0}, Wickets ${bowler.wickets || 0}, Overs ${oversDisplay(bowler.balls || 0)}, Economy ${economy(bowler)}`;
}

function creditBowler(bowlingTeamKey, runs, legalBall, wicket){
  const team = state[bowlingTeamKey];
  if(!team.activeBowlerId) return;
  const player = team.players.find(p=>p.id === team.activeBowlerId);
  if(!player) return;
  team.bowlers = team.bowlers || [];
  let bowler = team.bowlers.find(b=>b.id === team.activeBowlerId);
  if(!bowler){
    bowler = { id: player.id, name: player.name, runs: 0, balls: 0, wickets: 0 };
    team.bowlers.push(bowler);
  }
  bowler.name = player.name;
  bowler.runs = (bowler.runs || 0) + runs;
  bowler.balls = (bowler.balls || 0) + (legalBall ? 1 : 0);
  bowler.wickets = (bowler.wickets || 0) + (wicket ? 1 : 0);
}

function addBallEvent(teamKey, label, type){
  const team = state[teamKey];
  team.ballLog = team.ballLog || [];
  team.ballLog.push({ id: uid(), label, type });
  if(team.ballLog.length > 36){
    team.ballLog = team.ballLog.slice(-36);
  }
}

async function addExtra(teamKey, label){
  state[teamKey].extras = (state[teamKey].extras || 0) + 1;
  creditBowler(opponentKey(teamKey), 1, false, false);
  addBallEvent(teamKey, label, 'extra');
  await saveState();
  render();
}

function scoreboardSummaryHtml(activeTeamKey){
  const totA = teamTotals(state.teamA);
  const totB = teamTotals(state.teamB);
  const chase = chaseStatus(totB);
  const activeTeam = state[activeTeamKey];
  const bowlingTeamKey = opponentKey(activeTeamKey);
  const bowler = activeBowler(bowlingTeamKey);
  const batters = currentBatters(activeTeam);
  while(batters.length < 2){
    batters.push(null);
  }
  const battersHtml = batters.slice(0, 2).map((p, idx)=>`
    <div class="batter-card">
      <div class="label">Batsman ${idx + 1}</div>
      <div class="value">
        <span>${p ? escapeHtml(p.name) : 'Add player'}</span>
        <strong>${p ? `${p.runs}(${p.balls})` : '0(0)'}</strong>
      </div>
    </div>
  `).join('');
  const ballLogHtml = (activeTeam.ballLog || []).length
    ? activeTeam.ballLog.slice(-12).map(ball=>`
      <span class="ball-chip ${ball.type || ''}">${escapeHtml(ball.label)}</span>
    `).join('')
    : `<span class="ball-chip">-</span>`;
  const chaseHtml = chase
    ? `<div class="chase-info${chase.won ? ' done' : chase.short ? ' short' : ''}">
        ${chase.won
          ? `${escapeHtml(state.teamB.name)} won the chase`
          : chase.short
            ? `${escapeHtml(state.teamB.name)} short by ${chase.runsNeeded} runs`
            : `${escapeHtml(state.teamB.name)} needs ${chase.runsNeeded} runs in ${chase.ballsLeft} balls`}
      </div>`
    : '';

  return `
    <div class="summary">
      <div class="side">
        <h2>${escapeHtml(state.teamA.name)}</h2>
        <div class="score">${totA.runs}/${totA.outs}</div>
        <div class="overs">Extras ${totA.extras}</div>
        <div class="overs">${oversDisplay(totA.balls)} overs</div>
        <div class="balls-total">${totA.balls} balls</div>
      </div>
      <div class="vs">VS</div>
      <div class="side">
        <h2>${escapeHtml(state.teamB.name)}</h2>
        <div class="score">${totB.runs}/${totB.outs}</div>
        <div class="overs">Extras ${totB.extras}</div>
        <div class="overs">${oversDisplay(totB.balls)} overs</div>
        <div class="balls-total">${totB.balls} balls</div>
      </div>
      <div class="crease">${battersHtml}</div>
      <div class="current-bowler">
        Current bowler: <strong>${bowler ? escapeHtml(bowler.name) : 'Not selected'}</strong>
        ${bowler ? ` - ${bowler.runs || 0}/${bowler.wickets || 0} (${oversDisplay(bowler.balls || 0)}), Econ ${economy(bowler)}` : ''}
      </div>
      <div class="ball-log">${ballLogHtml}</div>
      ${chaseHtml}
    </div>
  `;
}

function chaseStatus(totB){
  if(!state.firstInningsComplete) return null;
  const target = state.targetRuns || 0;
  const totalBalls = state.firstInningsBalls || (state.matchOvers * 6);
  const runsNeeded = Math.max(target - totB.runs, 0);
  const ballsLeft = Math.max(totalBalls - totB.balls, 0);
  const won = runsNeeded === 0;
  const short = !won && ballsLeft === 0;
  return { target, totalBalls, runsNeeded, ballsLeft, won, short };
}

async function completeFirstInnings(){
  const totA = teamTotals(state.teamA);
  state.firstInningsComplete = true;
  state.firstInningsBalls = state.matchOvers * 6;
  state.targetRuns = totA.runs + 1;
  await saveState();
  render();
}

function matchResultText(totA, totB){
  if(!state.firstInningsComplete) return 'Match completed';
  if(totB.runs >= (state.targetRuns || 0)){
    return `${state.teamB.name} won`;
  }
  if(totA.runs > totB.runs){
    return `${state.teamA.name} won by ${totA.runs - totB.runs} runs`;
  }
  return 'Match tied';
}

async function completeMatch(){
  const totA = teamTotals(state.teamA);
  const totB = teamTotals(state.teamB);
  const completedMatches = pruneCompletedMatches(state.completedMatches);
  const completedAt = Date.now();
  const completedRecord = {
    id: uid(),
    completedAt,
    expiresAt: completedAt + COMPLETED_MATCH_RETENTION_MS,
    result: matchResultText(totA, totB),
    teamA: JSON.parse(JSON.stringify(state.teamA)),
    teamB: JSON.parse(JSON.stringify(state.teamB)),
    totals: { teamA: totA, teamB: totB },
    firstInningsComplete: state.firstInningsComplete,
    firstInningsBalls: state.firstInningsBalls,
    targetRuns: state.targetRuns
  };
  state = {
    ...defaultState(),
    completedMatches: [completedRecord, ...completedMatches]
  };
  await saveState();
  render();
}

function dateText(timestamp){
  if(!timestamp) return '';
  return new Date(timestamp).toLocaleString('en-IN', {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

        <div class="empty">Last 2 weeks mein completed match record nahi hai.</div>

  return `

      <h2>Completed matches - last 2 weeks</h2>
      <div class="history-list">
        ${matches.map(match=>`
          <div class="history-match">

            <div class="history-score">${match.totals.teamA.runs}/${match.totals.teamA.outs} - ${match.totals.teamB.runs}/${match.totals.teamB.outs}</div>
            <div class="history-meta">${escapeHtml(match.result || 'Match completed')} | Completed ${dateText(match.completedAt)} | Expires ${dateText(match.expiresAt)}</div>

}

    : `<tr><td colspan="2">No batsman added</td></tr>`;

function bowlingRows(team){
  return team.players.length
    ? team.players.map(player=>{
      const b = bowlerStatsForPlayer(team, player.id);
      return `
      <tr>
        <td><button type="button" class="bowler-detail-btn" data-bowler-id="${player.id}">${escapeHtml(player.name)}</button></td>
        <td>${b.runs || 0}/${b.wickets || 0} (${oversDisplay(b.balls || 0)})</td>
      </tr>
    `;
    }).join('')
    : `<tr><td colspan="2">No player added</td></tr>`;
}

function bowlerStatsForPlayer(team, playerId){
  return (team.bowlers || []).find(b=>b.id === playerId) || { id: playerId, runs: 0, balls: 0, wickets: 0 };
}

function allPlayers(){
  return [...state.teamA.players, ...state.teamB.players];
}

function allBowlers(){
  return [
    ...state.teamA.players.map(p=>({ ...bowlerStatsForPlayer(state.teamA, p.id), name: p.name })),
    ...state.teamB.players.map(p=>({ ...bowlerStatsForPlayer(state.teamB, p.id), name: p.name }))
  ];
}

function bindPublicDetails(){
  const detailBox = document.getElementById('playerDetailBox');
  const search = document.getElementById('batsmanSearch');
  if(!detailBox) return;

  document.querySelectorAll('.batsman-detail-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const player = allPlayers().find(p=>p.id === btn.dataset.playerId);
      detailBox.innerHTML = player ? playerDetailText(player) : 'Batsman nahi mila.';
    };
  });

  document.querySelectorAll('.bowler-detail-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const bowler = allBowlers().find(b=>b.id === btn.dataset.bowlerId);
      detailBox.innerHTML = bowler ? bowlerDetailText(bowler) : 'Bowler nahi mila.';
    };
  });

  if(search){
    search.oninput = ()=>{
      const q = search.value.trim().toLowerCase();
      if(!q){
        detailBox.textContent = 'Batsman name search ya click karein.';
        return;
      }
      const matches = allPlayers().filter(p=>p.name.toLowerCase().includes(q));
      detailBox.innerHTML = matches.length
        ? matches.map(playerDetailText).join('<br>')
        : 'Batsman nahi mila.';
    };
  }
}

function render(){
  const app = document.getElementById('app');
  state = normalizeState(state || defaultState());
  const activeTeamKey = state.firstInningsComplete ? 'teamB' : 'teamA';

  if(!currentUser){
    app.innerHTML = livePageHtml(activeTeamKey);
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('loginName').addEventListener('keydown', e=>{
      if(e.key === 'Enter') doLogin();
    });
    bindPublicDetails();
    return;
  }

  app.innerHTML = `
    <div class="masthead">
      <div class="eyebrow">Live scoring</div>
      <h1>Cricket Scoreboard</h1>
    </div>

    <div class="topbar">
      <span>Scoring by <span class="name">${escapeHtml(currentUser)}</span></span>
      <button class="btn btn-ghost btn-small" id="logoutBtn">Logout</button>
    </div>

    ${setupPanel()}

    ${matchDetailsHtml(activeTeamKey)}

    ${scoreboardSummaryHtml(activeTeamKey)}

    <div class="teams single">
      ${scoringPanel(activeTeamKey)}
    </div>

    ${completedMatchesHtml()}

    <div class="footer-note">Completed match ka record 2 weeks tak database mein rahega.</div>
  `;

  document.getElementById('logoutBtn').onclick = ()=>{
    currentUser = null;
    if(unsubscribeScore){
      unsubscribeScore();
      unsubscribeScore = null;
    }
    render();
  };

  [activeTeamKey].forEach(key=>{
    const nameInput = document.getElementById('name-'+key);
    nameInput.addEventListener('change', async ()=>{
      state[key].name = nameInput.value.trim() || (key==='teamA' ? 'Team A':'Team B');
      await saveState();
      render();
    });

    const addBtn = document.getElementById('addbtn-'+key);
    const addInput = document.getElementById('addinput-'+key);
    const addPlayerNow = async ()=>{
      const name = addInput.value.trim();
      if(!name) return;
      state[key].players.push(defaultPlayer(name));
      await saveState();
      render();
    };
    if(addBtn && addInput){
      addBtn.addEventListener('click', addPlayerNow);
      addInput.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          addPlayerNow();
        }
      });
    }

    state[key].players.forEach(p=>{
      const addRunBtn = (n)=>{
        const btn = document.getElementById(`run-${p.id}-${n}`);
        if(btn){
          btn.onclick = async ()=>{
            p.runs += n;
            p.balls += 1;
            p.runCounts = p.runCounts || { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0, 6: 0 };
            p.runCounts[n] = (p.runCounts[n] || 0) + 1;
            creditBowler(opponentKey(key), n, true, false);
            addBallEvent(key, String(n), n === 4 || n === 6 ? 'boundary' : '');
            await saveState();
            render();
          };
        }
      };
      [0,1,2,3,4,6].forEach(addRunBtn);

      const outBtn = document.getElementById('out-'+p.id);
      if(outBtn){
        outBtn.onclick = async ()=>{
          if(!p.out){
            p.out = true;
            p.balls += 1;
            creditBowler(opponentKey(key), 0, true, true);
            addBallEvent(key, 'W', 'wicket');
          }else{
            p.out = false;
          }
          await saveState();
          render();
        };
      }
      const delBtn = document.getElementById('del-'+p.id);
      if(delBtn){
        delBtn.onclick = async ()=>{
          state[key].players = state[key].players.filter(x=>x.id!==p.id);
          await saveState();
          render();
        };
      }
    });

    const wideBtn = document.getElementById('wide-'+key);
    if(wideBtn){
      wideBtn.onclick = ()=>addExtra(key, 'Wd');
    }
    const noBallBtn = document.getElementById('noball-'+key);
    if(noBallBtn){
      noBallBtn.onclick = ()=>addExtra(key, 'Nb');
    }

    [0,1].forEach(idx=>{
      const batterSelect = document.getElementById(`batterselect-${key}-${idx}`);
      if(batterSelect){
        batterSelect.onchange = async ()=>{
          state[key].activeBatterIds = state[key].activeBatterIds || [];
          state[key].activeBatterIds[idx] = batterSelect.value || null;
          state[key].activeBatterIds = state[key].activeBatterIds.filter(Boolean);
          await saveState();
          render();
        };
      }
    });

    const bowlingTeamKey = opponentKey(key);
    const bowlerSelect = document.getElementById('bowlerselect-'+bowlingTeamKey);
    if(bowlerSelect){
      bowlerSelect.onchange = async ()=>{
        state[bowlingTeamKey].activeBowlerId = bowlerSelect.value || null;
        await saveState();
        render();
      };
    }
  });

  const completeBtn = document.getElementById('completeFirstInningsBtn');
  if(completeBtn){
    completeBtn.onclick = completeFirstInnings;
  }
  const completeMatchBtn = document.getElementById('completeMatchBtn');
  if(completeMatchBtn){
    completeMatchBtn.onclick = completeMatch;
  }
  bindSetupControls();
}

function bindSetupControls(){
  const oversSelect = document.getElementById('matchOvers');
  if(oversSelect){
    oversSelect.onchange = async ()=>{
      state.matchOvers = clampMatchOvers(oversSelect.value);
      if(state.firstInningsComplete){
        state.firstInningsBalls = state.matchOvers * 6;
      }
      await saveState();
      render();
    };
  }

  ['teamA','teamB'].forEach(teamKey=>{
    const team = state[teamKey];
    const setupTeamName = document.getElementById('setup-team-name-'+teamKey);
    if(setupTeamName){
      setupTeamName.onchange = async ()=>{
        team.name = setupTeamName.value.trim() || (teamKey === 'teamA' ? 'Team A' : 'Team B');
        await saveState();
        render();
      };
    }

    const setupPlayerInput = document.getElementById('setup-player-'+teamKey);
    const setupPlayerBtn = document.getElementById('setup-player-btn-'+teamKey);
    const addSetupPlayer = async ()=>{
      const name = setupPlayerInput.value.trim();
      if(!name) return;
      team.players.push(defaultPlayer(name));
      await saveState();
      render();
    };
    if(setupPlayerInput && setupPlayerBtn){
      setupPlayerBtn.onclick = addSetupPlayer;
      setupPlayerInput.addEventListener('keydown', e=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          addSetupPlayer();
        }
      });
    }

    team.players.forEach(player=>{
      const editInput = document.getElementById(`setup-player-name-${teamKey}-${player.id}`);
      if(editInput){
        editInput.onchange = async ()=>{
          player.name = editInput.value.trim() || player.name;
          const bowler = (team.bowlers || []).find(b=>b.id === player.id);
          if(bowler) bowler.name = player.name;
          await saveState();
          render();
        };
      }
      const deleteBtn = document.getElementById(`setup-player-delete-${teamKey}-${player.id}`);
      if(deleteBtn){
        deleteBtn.onclick = async ()=>{
          team.players = team.players.filter(p=>p.id !== player.id);
          team.bowlers = (team.bowlers || []).filter(b=>b.id !== player.id);
          team.activeBatterIds = (team.activeBatterIds || []).filter(id=>id !== player.id);
          if(team.activeBowlerId === player.id) team.activeBowlerId = null;
          await saveState();
          render();
        };
      }
    });
  });
}

        <div class="detail-item">
          <div class="label">Current batting</div>
          <div class="value">${escapeHtml(activeTeam.name)}</div>
        </div>
        <div class="detail-item">
          <div class="label">Bowling team</div>
          <div class="value">${escapeHtml(bowlingTeam.name)}</div>
        </div>
        <div class="detail-item">
          <div class="label">${escapeHtml(state.teamA.name)}</div>
          <div class="value">${totA.runs}/${totA.outs} (${oversDisplay(totA.balls)})</div>
        </div>
        <div class="detail-item">
          <div class="label">${escapeHtml(state.teamB.name)}</div>
          <div class="value">${totB.runs}/${totB.outs} (${oversDisplay(totB.balls)})</div>
        </div>
        <div class="detail-item">
          <div class="label">Players</div>
          <div class="value">${state.teamA.players.length} / ${state.teamB.players.length}</div>
        </div>
        <div class="detail-item">
          <div class="label">Target</div>
          <div class="value">${state.firstInningsComplete ? state.targetRuns : 'After 1st innings'}</div>
        </div>
      </div>
    </div>
  `;
}

function setupTeamPanel(teamKey){
  const team = state[teamKey];
  return `
    <div class="team">
      <div class="team-head"><h2>${escapeHtml(team.name)} Setup</h2></div>
      <div class="field">
        <label for="setup-team-name-${teamKey}">Team name</label>
        <input id="setup-team-name-${teamKey}" type="text" value="${escapeHtml(team.name)}" maxlength="24" />
      </div>
      <div class="add-player">
        <input id="setup-player-${teamKey}" type="text" placeholder="Player ka naam" maxlength="24" />
        <button type="button" class="btn btn-small" id="setup-player-btn-${teamKey}">Add</button>
      </div>
      <div class="players">
        ${editablePlayersHtml(teamKey)}
      </div>
    </div>
  `;
}

function editablePlayersHtml(teamKey){
  const team = state[teamKey];
  return team.players.length
    ? team.players.map(player=>`
      <div class="player-edit">
        <input id="setup-player-name-${teamKey}-${player.id}" type="text" value="${escapeHtml(player.name)}" maxlength="24" />
        <button type="button" class="iconbtn" id="setup-player-delete-${teamKey}-${player.id}" title="Player hataayein">X</button>
      </div>
    `).join('')
    : `<div class="empty">Abhi koi player nahi joda gaya</div>`;
}

function teamPanel(key){
  const team = state[key];
  const bowlingTeamKey = opponentKey(key);
  const bowlingTeam = state[bowlingTeamKey];
  const inningsActionHtml = key === 'teamA' && !state.firstInningsComplete
    ? `<div class="innings-actions">
        <button type="button" class="btn btn-block" id="completeFirstInningsBtn">1st Inning Completed</button>
      </div>`
    : `<div class="innings-actions">
        <button type="button" class="btn btn-block" id="completeMatchBtn">Match Completed - Save 2 Weeks</button>
      </div>`;
  const bowlersHtml = (bowlingTeam.bowlers || []).length
    ? bowlingTeam.bowlers.map(b=>`
      <div class="player">
        <div class="player-row1">
          <span class="player-name">${escapeHtml(b.name)}</span>
          <span class="player-stats">${b.runs || 0}/${b.wickets || 0}<span class="balls">&nbsp;(${oversDisplay(b.balls || 0)}o)</span></span>
        </div>
        <div class="runbtns">
          <button type="button" class="runbtn extra${bowlingTeam.activeBowlerId === b.id ? ' active' : ''}" id="setbowler-${b.id}">
            ${bowlingTeam.activeBowlerId === b.id ? 'Bowling' : 'Set Bowler'}
          </button>
        </div>
      </div>
    `).join('')
    : `<div class="empty">Bowler add karein</div>`;
  const playersHtml = team.players.length
    ? team.players.map(p=>`
      <div class="player">
        <div class="player-row1">
          <span class="player-name${p.out? ' out':''}">${escapeHtml(p.name)}${p.out? ' (out)':''}</span>
          <span class="player-stats">${p.runs}<span class="balls">&nbsp;(${p.balls}b)</span></span>
        </div>
        <div class="runbtns">
          <button class="runbtn" id="run-${p.id}-0">0</button>
          <button class="runbtn" id="run-${p.id}-1">1</button>
          <button class="runbtn" id="run-${p.id}-2">2</button>
          <button class="runbtn" id="run-${p.id}-3">3</button>
          <button class="runbtn" id="run-${p.id}-4">4</button>
          <button class="runbtn six" id="run-${p.id}-6">6</button>
          <button class="iconbtn out-toggle" id="out-${p.id}" title="Out / Not out">${p.out ? '↺' : '✕'}</button>
          <button class="iconbtn" id="del-${p.id}" title="Player hataayein">🗑</button>
        </div>
      </div>
    `).join('')
    : `<div class="empty">Abhi koi player nahi joda gaya</div>`;

  return `
    <div class="team">
      <div class="team-head">
        <input id="name-${key}" type="text" value="${escapeHtml(team.name)}" maxlength="24" />
      </div>
      <div class="add-player" id="addform-${key}">
        <input id="addinput-${key}" type="text" placeholder="Player ka naam" maxlength="24" />
        <button type="button" class="btn btn-small" id="addbtn-${key}">Add</button>
      </div>
      <div class="add-player">
        <button type="button" class="runbtn extra" id="wide-${key}">Wide +1</button>
        <button type="button" class="runbtn extra" id="noball-${key}">No Ball +1</button>
      </div>
      <div class="players">${playersHtml}</div>
      <div class="team-head">
        <input type="text" value="${escapeHtml(bowlingTeam.name)} Bowling" disabled />
      </div>
      <div class="players">${bowlersHtml}</div>
      ${inningsActionHtml}
    </div>
  `;
}

function scoringPanel(key){
  const team = state[key];
  const bowlingTeamKey = opponentKey(key);
  const bowlingTeam = state[bowlingTeamKey];
  const selectedBatters = currentBatters(team);
  const bowler = activeBowler(bowlingTeamKey);
  const inningsActionHtml = key === 'teamA' && !state.firstInningsComplete
    ? `<div class="innings-actions">
        <button type="button" class="btn btn-block" id="completeFirstInningsBtn">1st Inning Completed</button>
      </div>`
    : `<div class="innings-actions">
        <button type="button" class="btn btn-block" id="completeMatchBtn">Match Completed - Save 2 Weeks</button>
      </div>`;
  const playersHtml = selectedBatters.length
    ? selectedBatters.map(p=>`
      <div class="player">
        <div class="player-row1">
          <span class="player-name${p.out? ' out':''}">${escapeHtml(p.name)}${p.out? ' (out)':''}</span>
          <span class="player-stats">${p.runs}<span class="balls">&nbsp;(${p.balls}b)</span></span>
        </div>
        <div class="runbtns">
          <button class="runbtn" id="run-${p.id}-0">0</button>
          <button class="runbtn" id="run-${p.id}-1">1</button>
          <button class="runbtn" id="run-${p.id}-2">2</button>
          <button class="runbtn" id="run-${p.id}-3">3</button>
          <button class="runbtn" id="run-${p.id}-4">4</button>
          <button class="runbtn six" id="run-${p.id}-6">6</button>
          <button class="iconbtn out-toggle" id="out-${p.id}" title="Out / Not out">${p.out ? 'Undo' : 'Out'}</button>
        </div>
      </div>
    `).join('')
    : `<div class="empty">Dropdown se batsman select karein</div>`;

  return `
    <div class="team">
      <div class="team-head">
        <input id="name-${key}" type="text" value="${escapeHtml(team.name)}" maxlength="24" />
      </div>
      <div class="add-player" id="addform-${key}">
        <select id="batterselect-${key}-0">${playerOptionsHtml(team, team.activeBatterIds[0], 'Batsman 1 select karein')}</select>
        <select id="batterselect-${key}-1">${playerOptionsHtml(team, team.activeBatterIds[1], 'Batsman 2 select karein')}</select>
      </div>
      <div class="add-player">
        <button type="button" class="runbtn extra" id="wide-${key}">Wide +1</button>
        <button type="button" class="runbtn extra" id="noball-${key}">No Ball +1</button>
      </div>
      <div class="players">${playersHtml}</div>
      <div class="team-head">
        <input type="text" value="${escapeHtml(bowlingTeam.name)} Bowling" disabled />
      </div>
      <div class="add-player">
        <select id="bowlerselect-${bowlingTeamKey}">${playerOptionsHtml(bowlingTeam, bowlingTeam.activeBowlerId, 'Bowler select karein')}</select>
      </div>
      <div class="players">
        <div class="empty">
          Current bowler: ${bowler ? `${escapeHtml(bowler.name)} - ${bowler.runs || 0}/${bowler.wickets || 0} (${oversDisplay(bowler.balls || 0)}o)` : 'Dropdown se bowler select karein'}
        </div>
      </div>
      ${inningsActionHtml}
    </div>
  `;
}

function playerOptionsHtml(team, selectedId, placeholder){
  const options = [`<option value="">${placeholder}</option>`];
  team.players.forEach(player=>{
    options.push(`<option value="${player.id}"${selectedId === player.id ? ' selected' : ''}>${escapeHtml(player.name)}</option>`);
  });
  return options.join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function doLogin(){
  const val = document.getElementById('loginName').value.trim();
  if(!val) return;
  currentUser = val;
  state = normalizeState(state || defaultState());
  render();

  const loaded = await loadState();
  if(loaded){
    state = loaded;
    render();
  }
  watchState();
}

async function init(){
  state = defaultState();
  render();
  const loaded = await loadState();
  if(loaded){
    state = loaded;
    render();
  }
  watchState();
}

init();
</script>
</body>
</html>
